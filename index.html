<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=800">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KSAN Wx">
<title>San Diego Kite Forecast (KSAN)</title>
<style>
:root{--bg:#0b1b3a;--panel:#12285a;--line:#2a4380;--text:#e8eefc;--mute:#9fb3e0;--label:#1b3a7a}
:root[data-theme="light"]{--bg:#f3f6fc;--panel:#e1e9f8;--line:#b8c5e2;--text:#10203f;--mute:#52638a;--label:#cfdbf3}
:root[data-theme="light"] .ktbl td.good{background:#d3f2de}
:root[data-theme="light"] .ktbl td.meh{background:#fbeabc}
:root[data-theme="light"] .ktbl td.bad{background:#f8d4d4}
:root[data-theme="light"] .circ{border:1px solid var(--line)}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-right:12px}
.sw{margin:14px 0 0;flex:none;display:flex;align-items:center;gap:6px;background:none;border:0;color:var(--text);font:inherit;cursor:pointer;padding:0}
.sw .track{width:42px;height:22px;border-radius:11px;background:var(--panel);border:1px solid var(--line);position:relative}
.sw .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--text);transition:transform .2s}
:root[data-theme="light"] .sw .knob{transform:translateX(20px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.3 system-ui,sans-serif}
h1{font-size:20px;margin:14px 12px 2px}
.sub{color:var(--mute);margin:0 12px 10px;font-size:12px}
.wrap{overflow-x:auto}
.grid{border-top:1px solid var(--line);display:grid;grid-template-columns:var(--lw,84px) repeat(24,var(--cw,36px));width:max-content}
.lab small{display:block;font-weight:400;text-transform:none;font-size:.85em;opacity:.85}
.cloud{background:#e3e8f2;color:#1b2a4a;border-radius:10px;padding:2px 4px;font-size:9px;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.35)}
.sm{font-size:9px;line-height:1.05;white-space:normal;text-align:center;color:var(--mute)}
.grid>div{border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;display:flex;align-items:center;justify-content:center;min-height:30px}
.lab{position:sticky;left:0;z-index:2;background:var(--label);font-weight:700;font-size:11px;text-transform:uppercase;padding:4px}
.day{background:var(--panel);font-weight:700}
.sky{font-size:22px}
.chart{grid-column:2/-1;padding:0!important;display:block!important;min-height:0!important}
.circ{width:26px;height:26px;border-radius:50%;background:#dfe6f5;color:#123;font-weight:700;display:flex;align-items:center;justify-content:center}
.arrow{font-size:20px;display:inline-block}
.err{padding:12px;color:#ffb4b4}
.layout{display:flex;align-items:flex-start;gap:12px;padding-right:12px}
.layout .wrap{flex:1;min-width:0}
#kiteBox{flex:0 0 300px;margin-top:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12px;line-height:1.35}
#kiteBox h2{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em}
#kiteBox h3{margin:12px 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
#kiteBox ul{margin:0;padding-left:16px}#kiteBox li{margin:2px 0}
.ktbl{width:100%;border-collapse:collapse}
.ktbl th,.ktbl td{border:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
.ktbl th{background:var(--label);font-size:11px}
.ktbl td.rt{font-weight:700}
.ktbl td.rt::first-letter{text-transform:uppercase}
.ktbl td.good{background:#14532d}.ktbl td.meh{background:#78560f}.ktbl td.bad{background:#6b1d1d}
.kdir{text-align:center}.kdir .arrow{font-size:1.5em;line-height:1}.ktbl .kdir small{margin-top:0}
.ktbl small{display:block;color:var(--mute);font-weight:400;margin-top:2px}
.basis{margin-top:10px;color:var(--mute);font-size:11px}
@media(max-width:900px){body{overflow-x:hidden}.layout{flex-direction:column;padding:0 8px;width:800px;min-width:800px;overflow:hidden}.grid{font-size:10px}.lab{font-size:9px;padding:2px;position:static}.layout .wrap{width:100%;overflow:hidden}#kiteBox{order:-1;flex:none;width:100%;margin-top:8px;font-size:18px;padding:14px}#kiteBox h2{font-size:20px}.ktbl th,.ktbl td{font-size:17px;padding:8px 10px}.basis{font-size:15px}}
</style>
<script>
(function(){var t=null;try{t=localStorage.getItem('theme')}catch(e){}
if(!t){
  var mobile=matchMedia('(max-width: 900px), (pointer: coarse)').matches;
  t=!mobile?'light':(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
}
document.documentElement.setAttribute('data-theme',t)})();
</script>
</head>
<body>
<div class="top">
<h1>San Diego International (KSAN) Forecast</h1>
<button class="sw" id="themeSw" role="switch" aria-label="Light mode" aria-checked="false"><span>🌙</span><span class="track"><span class="knob"></span></span><span>☀️</span></button>
</div>
<p class="sub" id="sub">Loading from weather.gov…</p>
<div class="layout">
<div class="wrap"><div class="grid" id="grid"></div></div>
<aside id="kiteBox">
  <h2>Kiteability</h2>
  <table class="ktbl">
    <thead><tr><th>Day</th><th>Rating</th><th>Wind / gust (kt)</th><th>Wind dir</th></tr></thead>
    <tbody id="kiteRows"><tr><td colspan="4">Loading…</td></tr></tbody>
  </table>
  <div class="basis">Based on minimum 15m kite and 630cm foil.</div>
</aside>
</div>
<script>
let CW=54;
const LAT=32.7336, LON=-117.1832, TZ='America/Los_Angeles', COLS=24, STEP=3;
const $=id=>document.getElementById(id);
(function(){
  const root=document.documentElement, sw=$('themeSw');
  const sync=()=>sw.setAttribute('aria-checked',root.getAttribute('data-theme')==='light');
  sync();
  sw.addEventListener('click',()=>{
    const t=root.getAttribute('data-theme')==='light'?'dark':'light';
    root.setAttribute('data-theme',t); sync();
    try{localStorage.setItem('theme',t)}catch(e){}
  });
})();

async function getTaf(){
  for(const u of ['/api/aviation','https://aviationweather.gov/api/data/taf?ids=KSAN&format=json']){
    try{const r=await fetch(u);if(!r.ok)continue;const j=await r.json();if(Array.isArray(j)&&j[0]&&j[0].fcsts)return j[0]}catch(e){}
  }
  return null;
}
async function getModel(){
  try{
    const u='https://api.open-meteo.com/v1/forecast?latitude=32.7336&longitude=-117.1832&hourly=cloud_cover_low,cloud_cover_mid,cloud_cover_high,visibility,temperature_2m,dew_point_2m&temperature_unit=fahrenheit&forecast_days=5&timezone=GMT';
    const r=await fetch(u); if(!r.ok) return null;
    const h=(await r.json()).hourly; if(!h||!h.time) return null;
    const m=new Map();
    h.time.forEach((t,i)=>m.set(Date.parse(t+'Z'),{lo:h.cloud_cover_low[i],mi:h.cloud_cover_mid[i],hi:h.cloud_cover_high[i],vis:h.visibility[i],T:h.temperature_2m[i],Td:h.dew_point_2m[i]}));
    return m;
  }catch(e){return null}
}
// Rough estimate from model cloud layers: low cloud base ~ 228 ft per °F of temp/dew point spread
function modelState(m,ms){
  const q=m&&m.get(Math.floor(ms/3600e3)*3600e3); if(!q) return null;
  const lcl=Math.max(200,Math.round(228*Math.max(0,q.T-q.Td)/100)*100);
  const base=(thr)=>q.lo>=thr?lcl:q.mi>=thr?10000:q.hi>=thr?25000:null;
  return {vis:q.vis==null?null:Math.min(10,Math.round(q.vis/1609.34*10)/10),ceil:base(50),low:base(10)};
}
function cloudSvg(vals,est){
  const W=COLS*CW,H=72,top=8,bot=10,MAX=12000;
  let out=`<svg width="${W}" height="${H}">`;
  [1000,3000,6000,10000].forEach(f=>{const y=H-bot-Math.sqrt(f/MAX)*(H-top-bot-12);out+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="2 4" opacity=".6"/>`});
  vals.forEach((v,i)=>{
    if(v==null) return;
    const fr=Math.sqrt(Math.min(v,MAX)/MAX), y=H-bot-fr*(H-top-bot-12)-12, cx=i*CW+CW/2, sc=Math.min(1,(CW-4)/24);
    out+=`<g transform="translate(${cx-12*sc},${y}) scale(${sc})" opacity="${est[i]?.55:1}"><title>${v>=MAX?'12,000+':v.toLocaleString()} ft${est[i]?' (estimated)':''}</title><path d="M6,13H18a4,4 0 0 0 .6-7.95A5.5,5.5 0 0 0 8,5.2A4,4 0 0 0 6,13Z" fill="#e3e8f2" stroke="#6d7ca3" stroke-width="1"/></g>`;
  });
  return out+'</svg>';
}
function parseVis(v){
  if(v==null||v==='')return null;
  if(typeof v==='number')return v;
  v=String(v).trim();
  if(v.endsWith('+'))return 10; // "6+" = 6 miles or more
  return v.split(/\s+/).reduce((a,p)=>a+(p.includes('/')?(+p.split('/')[0])/(+p.split('/')[1]):parseFloat(p)||0),0);
}
function tafState(taf,ms){
  if(!taf)return null; const t=ms/1000;
  if(t<taf.validTimeFrom||t>=taf.validTimeTo)return null;
  let st=null;
  for(const f of taf.fcsts||[]){
    const ch=f.fcstChange||'';
    if(ch==='TEMPO'||ch==='PROB')continue;
    const at=ch==='BECMG'?f.timeTo:f.timeFrom;
    if(st&&t<at)continue;
    const vis=parseVis(f.visib), cl=Array.isArray(f.clouds)?f.clouds:[];
    if(!st)st={vis,clouds:cl};
    else if(ch==='BECMG')st={vis:vis??st.vis,clouds:cl.length?cl:st.clouds};
    else st={vis:vis??st.vis,clouds:cl};
  }
  return st;
}
const baseOf=(cl,covers)=>{const b=cl.filter(c=>covers.includes(c.cover)&&typeof c.base==='number').map(c=>c.base);return b.length?Math.min(...b):null};
function durHours(d){const m=d.match(/P(?:(\d+)D)?T?(?:(\d+)H)?/);return (+(m[1]||0))*24+(+(m[2]||0))||1}
function toHourly(layer,spread){ // {validTime:"ISO/PT3H", value} -> Map(hourMs -> value)
  const map=new Map();
  (layer?.values||[]).forEach(v=>{
    const [s,d]=v.validTime.split('/'); const t=Date.parse(s), n=durHours(d);
    for(let i=0;i<n;i++) map.set(t+i*3600e3, spread&&v.value!=null?v.value/n:v.value);
  });
  return map;
}
const hourFmt=new Intl.DateTimeFormat('en-US',{timeZone:TZ,hour:'numeric',hour12:true});
const dayFmt=new Intl.DateTimeFormat('en-US',{timeZone:TZ,weekday:'short',month:'short',day:'numeric'});
const hourNum=t=>+new Intl.DateTimeFormat('en-US',{timeZone:TZ,hour:'numeric',hourCycle:'h23'}).format(t);

function area(vals,color,min,max,fmt=v=>Math.round(v)){
  const W=COLS*CW,H=80,p=16;
  const ok=vals.filter(v=>v!=null); if(!ok.length) return '';
  min=min??Math.min(...ok); max=max??Math.max(...ok); if(max===min) max=min+1;
  const x=i=>i*CW+CW/2, y=v=>H-6-((v-min)/(max-min))*(H-6-p);
  let pts=vals.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);
  const line=pts.map((q,i)=>(i?'L':'M')+q[0]+','+q[1]).join('');
  const poly=line+`L${pts.at(-1)[0]},${H}L${pts[0][0]},${H}Z`;
  const labels=vals.map((v,i)=>v==null?'':`<text x="${x(i)}" y="${y(v)-4}" text-anchor="middle" font-size="11" style="fill:var(--text)">${fmt(v)}</text>`).join('');
  return `<svg width="${W}" height="${H}"><defs><linearGradient id="g${color.slice(1)}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}"/><stop offset="1" stop-color="${color}" stop-opacity=".15"/></linearGradient></defs><path d="${poly}" fill="url(#g${color.slice(1)})"/><path d="${line}" stroke="${color}" fill="none" stroke-width="2"/>${labels}</svg>`;
}
const skyIcon=c=>c==null?'':c<15?'☀️':c<40?'🌤️':c<65?'⛅':c<85?'🌥️':'☁️';
const skyWord=c=>c==null?'':c<15?'Clear':c<40?'Mostly Clear':c<65?'Partly Cloudy':c<85?'Mostly Cloudy':'Cloudy';
const cardinal=d=>['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(d/22.5)%16];

async function load(){
  try{
    const pt=await (await fetch(`https://api.weather.gov/points/${LAT},${LON}`)).json();
    const g=(await (await fetch(pt.properties.forecastGridData)).json()).properties;
    const [taf,model]=await Promise.all([getTaf(),getModel()]);
    const L={sky:toHourly(g.skyCover),temp:toHourly(g.temperature),wd:toHourly(g.windDirection),
      ws:toHourly(g.windSpeed),gust:toHourly(g.windGust),pop:toHourly(g.probabilityOfPrecipitation),
      rh:toHourly(g.relativeHumidity),dew:toHourly(g.dewpoint),vis:toHourly(g.visibility),
      ceil:toHourly(g.ceilingHeight),qpf:toHourly(g.quantitativePrecipitation,true),
      thun:toHourly(g.probabilityOfThunder)};
    // first column: next 3-hour boundary (local)
    let t=Math.ceil(Date.now()/3600e3)*3600e3; while(hourNum(t)%STEP) t+=3600e3;
    const times=Array.from({length:COLS},(_,i)=>t+i*STEP*3600e3);
    const get=(k,conv=v=>v)=>times.map(x=>{const v=L[k].get(x);return v==null?null:conv(v)});
    const sky=get('sky'), temp=get('temp',c=>c*9/5+32), wd=get('wd'),
          ws=get('ws',k=>k*0.621371), gust=get('gust',k=>k*0.621371), pop=get('pop'), rh=get('rh');
    const grid=$('grid'); let h='';
    const small=innerWidth<=900, LW=small?72:84, wrapW=document.querySelector('.layout .wrap').clientWidth;
    CW=Math.max(small?26:30,Math.min(64,Math.floor((wrapW-LW-8)/COLS)));
    grid.style.setProperty('--lw',LW+'px'); grid.style.setProperty('--cw',CW+'px');
    const lb=(n,u)=>`<div class="lab"><div>${n}${u?`<small>${u}</small>`:''}</div></div>`;
    const row=(label,cells)=>h+=label+cells.map(c=>`<div>${c}</div>`).join('');
    const chartRow=(label,svg)=>h+=`${label}<div class="chart">${svg}</div>`;
    h+=lb('Date');
    for(let i=0;i<times.length;){let j=i;const k=dayFmt.format(times[i]);while(j<times.length&&dayFmt.format(times[j])===k)j++;h+=`<div class="day" style="grid-column:span ${j-i};font-size:10px">${k}</div>`;i=j}
    row(lb('Hour'),times.map(x=>hourFmt.format(x)));
    row(lb('Sky'),sky.map(c=>`<span class="sky">${skyIcon(c)}</span>`));
    chartRow(lb('Temp','(F)'),area(temp,'#e8613a'));
    row(lb('Wind direction','(azimuth)'),wd.map((d,i)=>d==null?'':(ws[i]!=null&&ws[i]<1.5)?'<span class="sm">CALM</span>':`<div><div style="font-size:10px">${Math.round(d)}</div><span class="arrow" style="transform:rotate(${d+180}deg)">↑</span></div>`));
    chartRow(lb('Average wind speeds','(mph)'),area(ws,'#3a9ad9',0));
    chartRow(lb('Maximum wind gust speeds','(mph)'),area(gust,'#4fcf6a',0));
    row(lb('Cloud coverage','%'),sky.map(c=>c==null?'':`<div class="circ" style="${c<40?'opacity:.5':''}">${Math.round(c)}</div>`));
    const st=times.map(x=>tafState(taf,x));
    const ms_=times.map(x=>modelState(model,x));
    const est=times.map((x,i)=>!st[i]&&!!ms_[i]);
    const ceilFt=times.map((x,i)=>st[i]?baseOf(st[i].clouds,['BKN','OVC','OVX']):(ms_[i]?ms_[i].ceil:null));
    const lowFt=times.map((x,i)=>st[i]?baseOf(st[i].clouds,['FEW','SCT','BKN','OVC','OVX']):(ms_[i]?ms_[i].low:null));
    const vis=times.map((x,i)=>st[i]?st[i].vis:(ms_[i]?ms_[i].vis:null));
    chartRow(lb('Cloud base @ 60% coverage','(AGL in feet)'),cloudSvg(ceilFt,est));
    chartRow(lb('Lowest cloud base','(AGL in feet)'),cloudSvg(lowFt,est));
    chartRow(lb('Visibility','(miles)'),area(vis,'#2f3fd6',0,10,v=>v>=10?'6+':Number.isInteger(v)?v:v.toFixed(1)));
    const rules=times.map((x,i)=>{
      if(!st[i]&&!ms_[i]) return ['–','var(--panel)','var(--mute)'];
      const c=ceilFt[i]??99999, v=vis[i]??10;
      return (c<500||v<1)?['LIFR','#c0392b']:(c<1000||v<3)?['IFR','#e67e22']:(c<=3000||v<=5)?['MVFR','#1e3cff']:['VFR','#1f8a2e'];
    });
    h+=lb('Flight rule')+rules.map(r=>`<div style="background:${r[1]};color:${r[2]||'#fff'};font-weight:700;font-size:10px">${r[0]}</div>`).join('');
    row(lb('Chance of precip'),pop.map(v=>v==null?'':`<div style="width:100%;text-align:center"><div>${Math.round(v)}%</div><div style="height:5px;margin:3px 4px 0;background:linear-gradient(90deg,#6aa8ff ${v}%,#243a6e ${v}%)"></div></div>`));
    const qpf=times.map(x=>{let s=0,any=false;for(let k=0;k<STEP;k++){const v=L.qpf.get(x+k*3600e3);if(v!=null){s+=v;any=true}}return any?s/25.4:null});
    row(lb('Precip amount','(range in inches)'),qpf.map(v=>v==null||v<0.005?'-':v.toFixed(2)));
    row(lb('Chance of thunder','%'),get('thun').map(v=>v==null?'':Math.round(v)));
    chartRow(lb('Rel hum','%'),area(rh,'#8f86f0',0,100));
    const dew=get('dew',c=>c*9/5+32);
    chartRow(lb('Dew point','(F)'),area(dew,'#6fd48a'));
    const spread=temp.map((t,i)=>t==null||dew[i]==null?null:t-dew[i]);
    chartRow(lb('Temp dew point spread','(F)'),area(spread,'#e88a8a',0));
    grid.innerHTML=h;

    // ---- Kiteability by day (rules in knots) ----
    const kt=k=>k*0.539957;
    const dayKey=ms=>new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(ms);
    const dayName=ms=>new Intl.DateTimeFormat('en-US',{timeZone:TZ,weekday:'long'}).format(ms);
    const t0=Math.floor(Date.now()/3600e3)*3600e3, days=new Map();
    for(let i=0;i<72;i++){
      const ms=t0+i*3600e3, key=dayKey(ms);
      if(!days.has(key)) days.set(key,{name:dayName(ms),s:null,g:null,dir:null,vx:0,vy:0});
      const d=days.get(key), s=L.ws.get(ms), gu=L.gust.get(ms);
      if(s!=null&&(d.s==null||kt(s)>d.s)){d.s=kt(s);d.dir=L.wd.get(ms)}
      const wdir=L.wd.get(ms); if(s!=null&&wdir!=null){const r=wdir*Math.PI/180;d.vx+=kt(s)*Math.sin(r);d.vy+=kt(s)*Math.cos(r)}
      if(gu!=null&&(d.g==null||kt(gu)>d.g)) d.g=kt(gu);
    }
    const rate=(s,g)=>{
      if(s!=null&&s>=15) return ["work is canceled, you're going kiting!","good"];
      if(s!=null&&s>=13) return ["excellent kiting day, get the twin tip and the surfboard","good"];
      if(s!=null&&s>=9) return ["good kiting day","good"];
      if(s!=null&&s>=7) return ["foilable","meh"];
      const low=g??s;
      return low!=null&&low>=4?["foilable, might swim","meh"]:["not kiteable","bad"];
    };
    const dirNote=d=>{
      if(d==null) return '—'; d=((Math.round(d)%360)+360)%360;
      if(d>=180&&d<=260) return 'south & gusty';
      if(d>=261||d<=20) return 'west/northwest';
      if(d>=21&&d<=160) return 'east wind, not good';
      return '—';
    };
    $('kiteRows').innerHTML=[...days.values()].slice(0,3).map(d=>{
      const [txt,cls]=rate(d.s,d.g);
      const pd=(Math.hypot(d.vx,d.vy)>0.5)?((Math.atan2(d.vx,d.vy)*180/Math.PI)+360)%360:null;
      const dcell=pd==null?'–':`<div class="kdir"><span class="arrow" style="transform:rotate(${pd+180}deg)">↑</span><small>${cardinal(pd)} ${Math.round(pd)}°</small></div>`;
      return `<tr><td><b>${d.name}</b></td><td class="rt ${cls}">${txt}<small>${dirNote(d.dir)}</small></td><td>${d.s==null?'–':Math.round(d.s)} / ${d.g==null?'–':Math.round(d.g)}</td><td>${dcell}</td></tr>`;
    }).join('');
    $('sub').innerHTML=`Updated ${new Date().toLocaleTimeString('en-US',{timeZone:TZ})} PT · Source: NWS / weather.gov · Cloud base &amp; visibility: KSAN TAF for about 30 hours, then a model estimate (faded clouds) · 3-hour steps${taf?'':' · (TAF unavailable)'}${model?'':' · (model data unavailable)'}`;
  }catch(e){ $('sub').innerHTML='<span class="err">Could not load forecast. Check your connection and refresh.</span>'; console.error(e); }
}
load(); setInterval(load,30*60e3);
let lastW=innerWidth,rt;
addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(innerWidth!==lastW){lastW=innerWidth;load()}},300)});
</script>
</body>
</html>
